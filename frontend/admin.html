<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f5f7fb">
<title>Quản trị | Hello DANAVA</title>
<link rel="icon" type="image/png" href="/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<script type="module" src="/admin.js"></script>
</head>
<body class="admin-page">
<div class="blobs" aria-hidden="true"><span></span><span></span><span></span></div>
<header class="top"><div class="wrap nav"><a class="brand" href="/"><img src="/logo.png" alt="DANAVA Solutions" width="164" height="40"><span class="brand-tag">Studio</span></a>
<a class="text-link" href="/">Xem bảng giá</a></div></header>
<main class="wrap admin">
<div class="notice" id="message" role="status" hidden></div>
<section id="signin" class="login" hidden>
<div class="login-art" aria-hidden="true"><img src="/mark.png" alt="" width="84" height="84"><p>Studio<br><b>Admin</b></p></div>
<div class="login-form">
<p class="kicker"><span>DANAVA Studio</span><span>Nhân viên</span></p><h1>Đăng nhập</h1>
<form id="login"><label>Email<input type="email" name="email" autocomplete="username" maxlength="160" required></label>
<label>Mật khẩu<input type="password" name="password" autocomplete="current-password" maxlength="128" required></label>
<button class="primary">Đăng nhập <i class="ico arrow" aria-hidden="true"></i></button></form>
</div>
</section>
<section id="workspace" hidden>
<div class="section-bar admin-head"><div><p class="eyebrow" id="identity"></p><h1>Quản trị báo giá</h1></div>
<button type="button" id="logout" class="small-button">Đăng xuất</button></div>
<nav id="tabs" class="admin-tabs" aria-label="Mục quản trị"></nav>
<div id="content"></div>
</section>
</main>
</body></html>
